<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entwurf C – Bento · cooolinho.de</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="../shared/content.js"></script>
<style>
:root {
    --bg: #f1ede4; --tile: #ffffff; --ink: #16131d; --muted: #696475; --line: #e4dfd3;
    --violet: #6a45ff; --lime: #c8f53a; --coral: #ff6a4d; --dark: #16131d;
    --h0: #ebe7dd; --h1: #cdbfff; --h2: #a58cff; --h3: #8263ff; --h4: #5a34f0;
    --shadow: 0 1px 2px rgba(22, 19, 29, .05), 0 12px 32px rgba(22, 19, 29, .06);
    --font: 'Bricolage Grotesque', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
[data-theme="dark"] {
    --bg: #0c0a11; --tile: #181521; --ink: #f2eff9; --muted: #9d97ad; --line: #2a2636;
    --violet: #7d5cff; --coral: #ff7a5e; --dark: #050408;
    --h0: #231f30; --h1: #3d2f85; --h2: #5a43c8; --h3: #7d5cff; --h4: #c8f53a;
    --shadow: none;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--font); padding: 96px 20px 40px; transition: background .4s, color .4s; }
a { color: inherit; }
ul, ol { list-style: none; }

.nav { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; padding: 6px;
    background: color-mix(in srgb, var(--tile) 85%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 99px; box-shadow: var(--shadow); font-weight: 600; font-size: .92rem; max-width: calc(100% - 24px); }
.nav a { text-decoration: none; padding: 8px 14px; border-radius: 99px; transition: background .2s; white-space: nowrap; }
.nav a:hover { background: var(--line); }
.nav .logo { background: var(--ink); color: var(--bg); }
.nav .logo:hover { background: var(--violet); color: #fff; }
.nav button { font: inherit; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--lime); color: #16131d; cursor: pointer; flex: none; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.nav button:hover { transform: rotate(180deg) scale(1.1); }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; max-width: 1240px; margin: 0 auto; }
.tile { position: relative; grid-column: span var(--s, 4); background: var(--tile); border: 1px solid var(--line); border-radius: 28px; padding: 28px; box-shadow: var(--shadow); overflow: hidden;
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out, border-color .25s; }
.tile::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--violet) 22%, transparent), transparent 70%); }
.tile:hover::after { opacity: 1; }
.tile.violet { background: var(--violet); color: #fff; border-color: transparent; }
.tile.lime { background: var(--lime); color: #16131d; border-color: transparent; }
.tile.coral { background: var(--coral); color: #16131d; border-color: transparent; }
.tile.violet::after, .tile.lime::after, .tile.coral::after { background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .28), transparent 70%); }
.js .pop { opacity: 0; scale: .92; translate: 0 24px; }
.js .pop.in { opacity: 1; scale: 1; translate: 0 0; transition: opacity .6s ease, scale .7s cubic-bezier(.3, 1.5, .5, 1), translate .7s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--d, 0) * 80ms); }

.label { font: 700 .74rem var(--font); letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
.heading { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin: 40px 8px 4px; }
.heading h2 { font: 800 clamp(2rem, 5vw, 3.4rem)/1 var(--font); letter-spacing: -0.04em; }
.heading span { color: var(--muted); font-weight: 600; }
h3 { font: 700 1.35rem/1.2 var(--font); letter-spacing: -0.02em; }

/* Hero */
.hero { --s: 8; grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding: 40px; min-height: 460px; }
h1 { font: 800 clamp(2.6rem, 7vw, 5.6rem)/.95 var(--font); letter-spacing: -0.05em; }
h1 .swap { display: block; color: var(--violet); font-size: .62em; line-height: 1.05; letter-spacing: -0.04em; min-height: 2.1em; margin-top: .25em; }
[data-theme="dark"] h1 .swap { color: var(--lime); }
h1 .swap span { display: inline-block; animation: swap .6s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes swap { from { opacity: 0; transform: translateY(.5em) rotate(4deg); } }
.hero p { font-size: 1.2rem; max-width: 46ch; color: var(--muted); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 1rem var(--font); text-decoration: none; padding: 14px 24px; border-radius: 99px; border: 2px solid var(--ink); background: none; color: inherit; cursor: pointer;
    transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), background .2s, color .2s; }
.btn:hover { transform: translateY(-3px) rotate(-2deg); }
.btn.solid { background: var(--ink); color: var(--bg); }
.tile.coral .btn { border-color: #16131d; }
.tile.coral .btn.solid { background: #16131d; color: #fff; }

/* Avatar mit Umlaufbahn */
.me { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-height: 260px; }
.orbit { position: relative; width: 150px; height: 150px; display: grid; place-items: center; margin: 34px; }
.orbit::before, .orbit::after { content: ''; position: absolute; border: 1.5px dashed rgba(255, 255, 255, .4); border-radius: 50%; inset: 0; }
.orbit::after { inset: -22px; border-style: dotted; opacity: .6; }
.orbit img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 4px solid #fff; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.me:hover .orbit img { transform: scale(1.12) rotate(6deg); }
.orbit .ring { position: absolute; inset: -22px; animation: spin 16s linear infinite; }
.orbit .ring b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-97px); }
.orbit .ring b span { display: inline-block; font: 700 .72rem var(--font); background: var(--lime); color: #16131d; padding: 3px 10px; border-radius: 99px; white-space: nowrap;
    transform: rotate(calc(-1 * var(--a))); animation: spin 16s linear infinite reverse; }
@keyframes spin { to { rotate: 360deg; } }
.me .status { font-weight: 600; font-size: .95rem; }
.me .status::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); margin-right: 8px; animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(200, 245, 58, .25); } }

/* Mini-Terminal (bleibt immer dunkel) */
.term { background: var(--dark); color: #e9e6f2; border-color: transparent; font: 400 .86rem/1.7 var(--mono); min-height: 190px; padding: 20px 22px; }
.term .dots { display: flex; gap: 6px; margin-bottom: 12px; }
.term .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
.term .dots i:nth-child(2) { background: #ffd34d; } .term .dots i:nth-child(3) { background: var(--lime); }
.term .p { color: var(--lime); }
.term .o { color: #a79fbd; }
.term .caret { display: inline-block; width: .55em; height: 1.05em; background: var(--lime); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.num b { display: block; font: 800 clamp(3rem, 6vw, 4.6rem)/.9 var(--font); letter-spacing: -0.05em; margin: 14px 0 8px; }
.num span { font-weight: 600; }
.about p { font-size: 1.12rem; }
.about p + p { margin-top: 12px; color: var(--muted); font-size: 1rem; }
.focus .big { font: 800 3.4rem/1 var(--font); letter-spacing: -0.05em; opacity: .28; position: absolute; right: 22px; top: 14px; }
.focus h3 { font-size: 1.8rem; margin: 10px 0 12px; }
.focus .count { display: inline-block; margin-top: 16px; font-weight: 700; font-size: .85rem; padding: 4px 12px; border-radius: 99px; border: 1.5px solid currentColor; }

.ticker { --s: 12; padding: 18px 0; display: grid; gap: 10px; }
.ticker div { display: flex; gap: 10px; width: max-content; animation: run 40s linear infinite; }
.ticker div:nth-child(2) { animation-direction: reverse; }
.ticker:hover div { animation-play-state: paused; }
@keyframes run { to { transform: translateX(-50%); } }
.chip { font-weight: 600; font-size: .95rem; padding: 7px 16px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), background .2s; }
.chip:hover { transform: translateY(-4px) rotate(-3deg); background: var(--lime); color: #16131d; }
.chip.hl { background: var(--violet); color: #fff; border-color: transparent; }

.proj { display: flex; flex-direction: column; text-decoration: none; min-height: 250px; }
.proj:hover { border-color: var(--violet); }
.proj .icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font: 800 1.3rem var(--font); background: var(--c); color: #16131d; margin-bottom: 18px; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.proj:hover .icon { transform: rotate(-12deg) scale(1.15); }
.proj h3 { overflow-wrap: anywhere; margin: 6px 0 8px; }
.proj p { color: var(--muted); font-size: .97rem; }
.proj .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 18px; }
.proj .tags span { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--bg); }
.proj .arrow { position: absolute; right: 22px; top: 22px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-weight: 700; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), background .2s, color .2s; }
.proj:hover .arrow { transform: rotate(-45deg) scale(1.15); background: var(--violet); color: #fff; }

.skills { --s: 12; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
.tabs button { font: 700 .95rem var(--font); padding: 9px 18px; border-radius: 99px; border: 2px solid var(--line); background: none; color: var(--ink); cursor: pointer; transition: all .2s; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.panel { display: flex; flex-wrap: wrap; gap: 10px; min-height: 96px; align-content: flex-start; }
.panel .chip { font-size: 1.15rem; padding: 10px 20px; animation: chipin .5s cubic-bezier(.3, 1.5, .5, 1) backwards; animation-delay: calc(var(--i) * 45ms); }
@keyframes chipin { from { opacity: 0; transform: translateY(16px) scale(.8) rotate(-6deg); } }

.career { --s: 7; }
.career details { border-top: 1px solid var(--line); }
.career details:first-of-type { border-top: 0; margin-top: 12px; }
.career summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 96px 1fr 30px; gap: 12px; align-items: center; padding: 16px 0; }
.career summary::-webkit-details-marker { display: none; }
.career .when { font: 700 .8rem var(--mono); color: var(--violet); }
[data-theme="dark"] .career .when { color: var(--lime); }
.career summary h3 { font-size: 1.1rem; }
.career summary small { display: block; color: var(--muted); font-size: .88rem; font-weight: 400; letter-spacing: 0; }
.career .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), background .2s; }
.career details[open] .plus { transform: rotate(135deg); background: var(--lime); color: #16131d; }
.career .more { padding: 0 0 18px 108px; font-size: .95rem; animation: chipin .4s ease backwards; }
.career .more li { padding-left: 18px; position: relative; }
.career .more li::before { content: '→'; position: absolute; left: 0; color: var(--coral); }
.career .more p { margin-top: 8px; font: 400 .78rem var(--mono); color: var(--muted); }
.side { grid-column: span 5; display: grid; gap: 16px; align-content: start; }
.side .tile { grid-column: auto; }

.gh .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 18px; }
.gh .row b { display: block; font: 800 2.2rem/1 var(--font); letter-spacing: -0.04em; }
.gh .row span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: var(--h0); }
.heat .l1 { background: var(--h1); } .heat .l2 { background: var(--h2); } .heat .l3 { background: var(--h3); } .heat .l4 { background: var(--h4); }
.heat .none { background: none; }
.in .heat i { animation: wave .7s cubic-bezier(.3, 1.6, .5, 1) backwards; animation-delay: calc(var(--w, 52) * 20ms); }
@keyframes wave { from { opacity: 0; transform: translateY(8px) scale(.3); } }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin: 20px 0 10px; gap: 2px; }
.stack i { width: var(--p); background: var(--c); transition: flex .3s; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.vol ul { margin-top: 10px; font-size: .95rem; }
.vol li { padding-left: 18px; position: relative; }
.vol li::before { content: '→'; position: absolute; left: 0; }

.contact { --s: 12; padding: 56px 40px; display: grid; gap: 28px; }
.contact h2 { font: 800 clamp(2.6rem, 9vw, 7rem)/.9 var(--font); letter-spacing: -0.05em; }
.contact .mail { font: 700 clamp(1.1rem, 3.6vw, 2rem) var(--font); overflow-wrap: anywhere; }
footer { max-width: 1240px; margin: 28px auto 0; display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; font-weight: 600; padding: 0 8px; }

@media (max-width: 960px) {
    .tile { --s: 6; }
    .hero, .career, .side, .ticker, .skills, .contact, .about { grid-column: 1 / -1; }
    .side { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
    body { padding: 84px 12px 28px; font-size: 16px; }
    .grid, .side { gap: 12px; }
    .tile { grid-column: 1 / -1; padding: 22px; border-radius: 22px; }
    .tile.num { grid-column: span 6; }
    .side { grid-template-columns: 1fr; }
    .hero { padding: 28px 22px; min-height: 0; gap: 28px; }
    .nav a:not(.logo) { padding: 8px 9px; font-size: .84rem; }
    .nav .opt { display: none; }
    .contact { padding: 36px 22px; }
    .career summary { grid-template-columns: 1fr 30px; }
    .career .when { grid-column: 1 / -1; margin-bottom: -8px; }
    .career .more { padding-left: 0; }
    .proj { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<nav class="nav" aria-label="Bereiche">
    <a class="logo" href="#top">cooolinho</a>
    <a href="#projects">Projekte</a><a href="#skills">Skills</a><a href="#career">Werdegang</a><a class="opt" href="#contact">Kontakt</a>
    <button type="button" data-theme-toggle aria-label="Hell/Dunkel umschalten">◐</button>
</nav>
<main class="grid" id="top"></main>
<footer><span>© 2026 Colin Deepe</span><span>Entwurf C · Bento</span></footer>

<script>
const S = window.SITE;
const colors = ['var(--lime)', 'var(--coral)', '#b9a6ff', '#ffd34d', '#8fe0ff', 'var(--lime)'];
const langColors = ['var(--violet)', 'var(--coral)', 'var(--lime)', '#ffd34d', '#8fe0ff', '#ff9ecb', 'var(--muted)'];
const chip = (item, i = 0) => `<span class="chip${S.highlight.includes(item) ? ' hl' : ''}" style="--i:${i}">${item}</span>`;
const allSkills = S.skills.flatMap((group) => group.items);
const half = Math.ceil(allSkills.length / 2);
const row = (items) => { const html = items.map((item) => chip(item)).join(''); return `<div>${html}${html}</div>`; };

document.getElementById('top').innerHTML = `
    <section class="tile hero pop">
        <span class="label">${S.role}</span>
        <div><h1>Hi, ich bin Colin.<span class="swap" id="swap" aria-live="off"><span>Ich baue Online-Shops.</span></span></h1></div>
        <div style="display:grid;gap:22px">
            <p>Über 10 Jahre Praxis in E-Commerce und Webentwicklung – von der Konzeption über die Umsetzung bis zum Go-live.</p>
            <div class="cta"><a class="btn solid" href="#contact">Schreib mir →</a><a class="btn" href="#projects">Projekte ansehen</a></div>
        </div>
    </section>
    <section class="tile violet me pop" style="--d:1">
        <div class="orbit"><img src="${S.photo}" alt="Avatar von Colin Deepe" width="104" height="104">
            <div class="ring" aria-hidden="true">${S.highlight.map((word, i) => `<b style="--a:${i * 120}deg"><span>${word}</span></b>`).join('')}</div></div>
        <div><h3>@${S.handle}</h3><p class="status">${S.current}</p></div>
    </section>
    <section class="tile term pop" style="--d:2" aria-label="Terminal-Zitat">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="term"></div>
    </section>

    <section class="tile about pop" style="--s:6"><span class="label">Über mich</span><p style="margin-top:12px">${S.about[0]}</p><p>${S.about[1]}</p></section>
    <section class="tile lime num pop" style="--s:3;--d:1"><span class="label">Praxis</span><b><span data-count="10">10</span>+</b><span>Jahre E-Commerce &amp; Web</span></section>
    <section class="tile coral num pop" style="--s:3;--d:2"><span class="label">GitHub</span><b data-count="${S.stats.contributions}">${S.stats.contributions}</b><span>Contributions in 12 Monaten</span></section>

    <div class="heading" id="focus"><h2>Fokus</h2><span>womit ich gerade am liebsten baue</span></div>
    ${S.focus.map((f, i) => `<section class="tile focus pop ${['', 'violet', 'lime'][i]}" style="--d:${i}">
        <span class="label">Fokus</span><span class="big" aria-hidden="true">0${i + 1}</span><h3>${f.title}</h3><p>${f.text}</p><span class="count">${f.count} Projekte auf GitHub</span></section>`).join('')}
    <div class="tile ticker pop" aria-hidden="true">${row(allSkills.slice(0, half))}${row(allSkills.slice(half))}</div>

    <div class="heading" id="projects"><h2>Projekte</h2><span>Open Source, Beruf &amp; Ehrenamt</span></div>
    ${S.projects.map((p, i) => `<a class="tile proj pop" style="--d:${i % 3};--c:${colors[i]}" href="${p.url}" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">${p.name[0].toUpperCase()}</span><span class="arrow" aria-hidden="true">→</span>
        <span class="label">${p.kind}</span><h3>${p.name}</h3><p>${p.text}</p>
        <span class="tags">${p.tags.map((tag) => `<span>${tag}</span>`).join('')}</span></a>`).join('')}

    <div class="heading" id="skills"><h2>Skills</h2><span>${allSkills.length} Werkzeuge in ${S.skills.length} Schubladen</span></div>
    <section class="tile skills pop">
        <div class="tabs" role="tablist">${S.skills.map((g, i) => `<button type="button" role="tab" aria-selected="${i === 1}" data-tab="${i}">${g.title}</button>`).join('')}</div>
        <div class="panel" id="panel" role="tabpanel"></div>
    </section>

    <div class="heading" id="career"><h2>Werdegang</h2><span>seit 2012 dabei</span></div>
    <section class="tile career pop"><span class="label">Stationen</span>
        ${S.career.map((c, i) => `<details name="career"${i === 0 ? ' open' : ''}>
            <summary><span class="when">${c.from}${c.to === 'heute' ? ' →' : ''}</span><h3>${c.title}<small>${c.org}</small></h3><span class="plus" aria-hidden="true">+</span></summary>
            <div class="more">${c.points.length ? `<ul>${c.points.map((pt) => `<li>${pt}</li>`).join('')}</ul>` : `<p>${c.from} – ${c.to}</p>`}${c.stack ? `<p>${c.stack}</p>` : ''}</div>
        </details>`).join('')}
    </section>
    <div class="side">
        <section class="tile gh pop" style="--d:1"><span class="label">GitHub · letzte 12 Monate</span>
            <div class="row">${[[S.stats.repos, 'eigene Repos'], [S.stats.commits, 'Commits'], [S.stats.activeDays, 'aktive Tage']].map(([n, label]) => `<div><b data-count="${n}">${n}</b><span>${label}</span></div>`).join('')}</div>
            ${heatmapHTML(S.stats.heatmap)}
            <div class="stack">${S.stats.languages.map(([, p], i) => `<i style="--p:${p}%;--c:${langColors[i]}"></i>`).join('')}</div>
            <div class="legend">${S.stats.languages.map(([name, p], i) => `<span><i style="--c:${langColors[i]}"></i>${name} ${p}%</span>`).join('')}</div>
        </section>
        <section class="tile violet vol pop" style="--d:2"><span class="label">Ehrenamt · ${S.volunteer.since}</span>
            <h3 style="margin:10px 0 2px">${S.volunteer.title}</h3><p>${S.volunteer.org}</p>
            <ul>${S.volunteer.points.map((pt) => `<li>${pt}</li>`).join('')}</ul></section>
    </div>

    <section class="tile coral contact pop" id="contact" style="margin-top:40px">
        <span class="label">Kontakt</span>
        <h2>Lass uns<br>sprechen.</h2>
        <p class="mail">${S.email}</p>
        <div class="cta"><a class="btn solid" href="mailto:${S.email}">E-Mail schreiben →</a>
            <button class="btn" type="button" id="copy">Adresse kopieren</button>
            <a class="btn" href="${S.github}" target="_blank" rel="me noopener">GitHub ↗</a></div>
    </section>`;

onReveal('.pop', (node) => node.querySelectorAll('[data-count]').forEach(countUp));

// Wechselnde Zeile im Hero
const lines = ['Ich baue Online-Shops.', 'Ich baue Admin-Panels.', 'Ich baue Business-Apps.', 'Ich baue mit Claude Code.'];
let line = 0;
if (!REDUCED) setInterval(() => { line = (line + 1) % lines.length; document.getElementById('swap').innerHTML = `<span>${lines[line]}</span>`; }, 2600);

// Mini-Terminal: tippt Befehle in Schleife
const script = [['whoami', 'colin deepe · software engineer'], ['cat focus.md', 'laravel · filament · claude code'], ['uptime', 'up 10+ years, load: shops, saas, tools']];
const term = document.getElementById('term');
const esc = (text) => text.replace(/[<>&]/g, '');
function renderTerm(done, typing) {
    term.innerHTML = done.map(([cmd, out]) => `<div><span class="p">❯</span> ${esc(cmd)}</div><div class="o">${esc(out)}</div>`).join('')
        + `<div><span class="p">❯</span> ${esc(typing)}<span class="caret"></span></div>`;
}
if (REDUCED) renderTerm(script, ''); else (async function loop() {
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    for (;;) {
        for (let i = 0; i < script.length; i++) {
            for (let c = 0; c <= script[i][0].length; c++) { renderTerm(script.slice(0, i), script[i][0].slice(0, c)); await wait(70); }
            await wait(350);
            renderTerm(script.slice(0, i + 1), '');
            await wait(900);
        }
        await wait(2600);
    }
})();

// Skill-Tabs
const panel = document.getElementById('panel');
function showTab(index) {
    document.querySelectorAll('[data-tab]').forEach((tab) => tab.setAttribute('aria-selected', tab.dataset.tab === String(index)));
    panel.innerHTML = S.skills[index].items.map(chip).join('');
}
document.querySelector('.tabs').addEventListener('click', (e) => { if (e.target.dataset.tab) showTab(Number(e.target.dataset.tab)); });
showTab(1);

// Kacheln kippen zur Maus, Lichtfleck folgt
if (matchMedia('(hover: hover)').matches && !REDUCED) document.querySelectorAll('.tile').forEach((tile) => {
    tile.addEventListener('pointermove', (e) => {
        const box = tile.getBoundingClientRect();
        const x = (e.clientX - box.left) / box.width, y = (e.clientY - box.top) / box.height;
        const max = Math.min(5, 1800 / box.width);
        tile.style.setProperty('--mx', `${x * 100}%`); tile.style.setProperty('--my', `${y * 100}%`);
        tile.style.setProperty('--ry', `${(x - .5) * max}deg`); tile.style.setProperty('--rx', `${(.5 - y) * max}deg`);
    });
    tile.addEventListener('pointerleave', () => { tile.style.setProperty('--rx', '0deg'); tile.style.setProperty('--ry', '0deg'); });
});

document.getElementById('copy').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(S.email); e.target.textContent = 'Kopiert ✓'; } catch { e.target.textContent = S.email; }
    setTimeout(() => { e.target.textContent = 'Adresse kopieren'; }, 1800);
});
</script>
</body>
</html>
