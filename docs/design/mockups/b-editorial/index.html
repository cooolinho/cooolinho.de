<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entwurf B – Editorial · cooolinho.de</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../shared/content.js"></script>
<style>
:root {
    --bg: #f6f1e7; --ink: #1b1a17; --muted: #6d665b; --rule: #d6ccba; --accent: #cf3f17; --soft: #ece4d4; --on-accent: #fff8ee;
    --h1: #efc4a8; --h2: #e79568; --h3: #dc6436; --h4: #cf3f17;
    --serif: 'Fraunces', Georgia, serif; --sans: 'Instrument Sans', system-ui, sans-serif;
}
[data-theme="dark"] {
    --bg: #141310; --ink: #ede7d9; --muted: #9a9283; --rule: #34312a; --accent: #ff6b3d; --soft: #1e1c18; --on-accent: #141310;
    --h1: #5a2c1b; --h2: #8f4226; --h3: #c85630; --h4: #ff6b3d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.65 var(--sans); overflow-x: hidden; transition: background .4s, color .4s; }
a { color: inherit; }
ul, ol { list-style: none; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }

.progress { position: fixed; inset: 0 0 auto 0; height: 3px; background: var(--accent); transform-origin: left; transform: scaleX(0); z-index: 40; }
.mast { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.mast .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
.mast .logo { font: italic 600 1.35rem var(--serif); text-decoration: none; margin-right: auto; }
.mast .logo span { color: var(--accent); }
.mast nav { display: flex; gap: 24px; font-size: .9rem; }
.mast nav a { text-decoration: none; position: relative; }
.mast nav a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: right; transition: transform .3s; }
.mast nav a:hover::after { transform: scaleX(1); transform-origin: left; }
.mast button { font: 500 .85rem var(--sans); color: var(--ink); background: none; border: 1px solid var(--ink); border-radius: 99px; padding: 6px 14px; cursor: pointer; transition: background .2s, color .2s; }
.mast button:hover { background: var(--ink); color: var(--bg); }

.hero { padding: 88px 0 56px; }
.kicker { font: 500 .8rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.kicker b { color: var(--accent); font-weight: 500; }
h1 { font: 400 clamp(2.7rem, 7.6vw, 7rem)/1.02 var(--serif); letter-spacing: -0.03em; margin: 24px 0 44px; max-width: 15ch; font-variation-settings: 'opsz' 144; }
h1 em { color: var(--accent); font-weight: 300; }
h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .12em; margin-bottom: -.12em; }
h1 .w > span { display: inline-block; }
.js h1 .w > span { transform: translateY(110%); animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 60ms + 150ms); }
@keyframes rise { to { transform: none; } }
.byline { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.byline img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 1px solid var(--rule); transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.byline img:hover { transform: rotate(-8deg) scale(1.15); }
.byline p { line-height: 1.35; margin-right: auto; }
.byline small { display: block; color: var(--muted); font-size: .9rem; }
.btn { display: inline-flex; gap: 10px; align-items: center; text-decoration: none; font-weight: 500; padding: 13px 24px; border-radius: 99px; border: 1px solid var(--ink); transition: background .25s, color .25s, border-color .25s; }
.btn i { font-style: normal; transition: transform .25s; }
.btn:hover i { transform: translateX(5px); }
.btn.fill { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.figures { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); margin-top: 64px; }
.figures div { padding: 22px 20px 0 0; }
.figures div + div { padding-left: 20px; border-left: 1px solid var(--rule); }
.figures b { display: block; font: 300 clamp(2.4rem, 5vw, 4.2rem)/1 var(--serif); letter-spacing: -0.03em; }
.figures b sup { font-size: .5em; color: var(--accent); }
.figures div > span { color: var(--muted); font-size: .9rem; }

.chapter { display: grid; grid-template-columns: 3fr 9fr; gap: 40px; padding: 88px 0; border-top: 1px solid var(--rule); }
.chapter > header { position: sticky; top: 96px; align-self: start; }
.chapter .no { font: italic 300 1.1rem var(--serif); color: var(--accent); }
.chapter h2 { font: 400 clamp(1.8rem, 3vw, 2.5rem)/1.1 var(--serif); letter-spacing: -0.02em; }
.js .rv { opacity: 0; transform: translateY(26px); }
.js .rv.in { opacity: 1; transform: none; transition: opacity .8s ease, transform .8s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--d, 0) * 90ms); }

.lede { font: 400 clamp(1.4rem, 2.5vw, 2.05rem)/1.32 var(--serif); letter-spacing: -0.01em; }
.lede::first-letter { font-size: 3.4em; float: left; line-height: .82; padding: .06em .1em 0 0; color: var(--accent); font-weight: 300; }
.body { max-width: 62ch; margin-top: 28px; color: var(--muted); }
.body b, .hl { color: var(--ink); font-weight: 600; }

.focus li { display: grid; grid-template-columns: 70px 1fr 2fr; gap: 24px; padding: 30px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.focus li:first-child { border-top: 0; padding-top: 0; }
.focus .n { font: italic 300 2rem var(--serif); color: var(--accent); }
.focus h3 { font: 400 2rem/1.1 var(--serif); }
.focus small { display: block; margin-top: 8px; font: 500 .78rem var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.focus p { color: var(--muted); }

.band { background: var(--accent); color: var(--on-accent); overflow: hidden; padding: 20px 0; font: italic 300 clamp(1.6rem, 4vw, 3rem) var(--serif); white-space: nowrap; }
.band div { display: inline-block; animation: slide 32s linear infinite; }
.band span { margin: 0 .5em; }
.band span::after { content: '✳'; font-style: normal; margin-left: 1em; font-size: .6em; vertical-align: middle; }
@keyframes slide { to { transform: translateX(-50%); } }

.works a { position: relative; display: grid; grid-template-columns: 1.2fr 1.6fr auto; gap: 28px; align-items: center; padding: 28px 16px; margin: 0 -16px; text-decoration: none; border-bottom: 1px solid var(--rule); overflow: hidden; transition: color .35s; }
.works a::before { content: ''; position: absolute; inset: 0; background: var(--ink); transform: translateY(101%); transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.works a > * { position: relative; }
.works a:hover { color: var(--bg); }
.works a:hover::before { transform: none; }
.works h3 { font: 400 clamp(1.3rem, 2.1vw, 1.75rem)/1.15 var(--serif); overflow-wrap: anywhere; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.works a:hover h3 { transform: translateX(10px); font-style: italic; }
.works small { display: block; font: 500 .75rem var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.works p { font-size: .95rem; opacity: .75; }
.works .tags { display: block; font-size: .8rem; margin-top: 6px; opacity: .7; }
.works .go { font-size: 1.6rem; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.works a:hover .go { transform: translate(6px, -6px) rotate(-45deg); color: var(--accent); }

.skills div { display: grid; grid-template-columns: 1fr 3fr; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.skills dt { font: italic 400 1.25rem var(--serif); }
.skills dd { color: var(--muted); }
.skills dd b { color: var(--accent); font-weight: 600; }

.career li { display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 30px 0; border-bottom: 1px solid var(--rule); }
.career li:first-child { padding-top: 0; }
.career .yr { font: 300 3.2rem/1 var(--serif); letter-spacing: -0.04em; transition: color .3s; }
.career li:hover .yr { color: var(--accent); }
.career .span { display: block; font: 500 .75rem var(--sans); letter-spacing: .08em; color: var(--muted); margin-top: 8px; }
.career h3 { font: 500 1.3rem/1.25 var(--serif); }
.career .org { color: var(--muted); font-style: italic; font-family: var(--serif); }
.career ul { margin-top: 10px; font-size: .97rem; }
.career ul li { display: block; padding: 0 0 0 20px; border: 0; position: relative; }
.career ul li::before { content: '—'; position: absolute; left: 0; color: var(--accent); }
.career .stack { font-size: .8rem; color: var(--muted); margin-top: 10px; letter-spacing: .02em; }
.pill { display: inline-block; font: 500 .7rem var(--sans); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--accent); color: var(--accent); border-radius: 99px; padding: 1px 9px; margin-left: 8px; vertical-align: middle; }

.gh { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 36px; }
.gh b { display: block; font: 300 3rem/1 var(--serif); letter-spacing: -0.03em; }
.gh span { font-size: .85rem; color: var(--muted); }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 50%; background: var(--soft); }
.heat .l1 { background: var(--h1); } .heat .l2 { background: var(--h2); } .heat .l3 { background: var(--h3); } .heat .l4 { background: var(--h4); }
.heat .none { background: none; }
.js .heat i { transform: scale(0); }
.js .in .heat i { transform: none; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); transition-delay: calc(var(--w, 52) * 18ms); }
.cap { font-size: .8rem; color: var(--muted); margin: 10px 0 36px; }
.langs li { display: grid; grid-template-columns: 130px 1fr 50px; gap: 16px; align-items: center; padding: 7px 0; }
.langs li > span:first-child { font: italic 400 1.1rem var(--serif); }
.langs .track { height: 1px; background: var(--rule); position: relative; }
.langs .fill { position: absolute; left: 0; top: -2px; height: 5px; width: var(--p); background: var(--accent); transform-origin: left; }
.js .langs .fill { transform: scaleX(0); }
.js .in .langs .fill { transform: none; transition: transform 1.2s cubic-bezier(.2, .8, .2, 1) .3s; }
.langs li > span:last-child { text-align: right; color: var(--muted); font-size: .9rem; }

.outro { padding: 110px 0 72px; border-top: 1px solid var(--ink); }
.outro a.mail { display: inline-block; font: 300 clamp(1.7rem, 6.6vw, 6rem)/1.05 var(--serif); letter-spacing: -0.03em; text-decoration: none; margin: 18px 0 40px;
    background: linear-gradient(var(--accent), var(--accent)) left bottom / 0 2px no-repeat; transition: background-size .6s cubic-bezier(.2, .8, .2, 1), color .3s; overflow-wrap: anywhere; }
.outro a.mail:hover { background-size: 100% 2px; color: var(--accent); font-style: italic; }
footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; padding: 24px 0 40px; border-top: 1px solid var(--rule); }

@media (max-width: 860px) {
    .wrap { padding: 0 20px; }
    .mast nav { display: none; }
    .hero { padding: 48px 0 40px; }
    .figures { grid-template-columns: 1fr 1fr; }
    .figures div { padding: 18px 12px 18px 0; }
    .figures div + div { border-left: 0; padding-left: 0; }
    .figures div:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--rule); }
    .figures div:nth-child(n+3) { border-top: 1px solid var(--rule); }
    .chapter { grid-template-columns: 1fr; gap: 28px; padding: 56px 0; }
    .chapter > header { position: static; }
    .focus li { grid-template-columns: 44px 1fr; }
    .focus p { grid-column: 2; }
    .works a { grid-template-columns: 1fr auto; gap: 10px 16px; padding: 22px 12px; margin: 0 -12px; }
    .works p { grid-column: 1; grid-row: 2; }
    .skills div { grid-template-columns: 1fr; gap: 4px; }
    .career li { grid-template-columns: 1fr; gap: 10px; }
    .career .yr { font-size: 2.4rem; }
    .career .span { display: inline; margin-left: 10px; }
    .gh { grid-template-columns: 1fr 1fr; }
    .langs li { grid-template-columns: 100px 1fr 40px; }
    .outro { padding: 64px 0 48px; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .js h1 .w > span { transform: none; }
}
</style>
</head>
<body>
<div class="progress" id="progress" data-fixed></div>
<header class="mast">
    <div class="wrap">
        <a class="logo" href="#top">cooolinho<span>.</span>de</a>
        <nav aria-label="Bereiche">
            <a href="#about">Über mich</a><a href="#projects">Projekte</a><a href="#skills">Können</a><a href="#career">Werdegang</a><a href="#contact">Kontakt</a>
        </nav>
        <button type="button" data-theme-toggle>Hell / Dunkel</button>
    </div>
</header>
<main id="top"></main>

<script>
const S = window.SITE;
const mark = (text) => S.highlight.reduce((out, word) => out.replaceAll(word, `<b>${word}</b>`), text);
const headline = 'Ich baue Online-Shops und Business-Anwendungen – von der *Konzeption* bis zum *Go-live.*'
    .split(' ').map((word, i) => {
        const em = word.startsWith('*');
        const text = word.replaceAll('*', '');
        return `<span class="w"><span style="--i:${i}">${em ? `<em>${text}</em>` : text}</span></span>`;
    }).join(' ');
const chapter = (id, no, title, html) => `
    <section class="chapter wrap" id="${id}">
        <header class="rv"><p class="no">Nº ${no}</p><h2>${title}</h2></header>
        <div>${html}</div>
    </section>`;
const marquee = [...S.skills[1].items, ...S.skills[5].items.slice(0, 3)].map((item) => `<span>${item}</span>`).join('');

document.getElementById('top').innerHTML = `
    <section class="hero wrap">
        <p class="kicker"><b>●</b> ${S.role} · seit 2012</p>
        <h1 aria-label="Ich baue Online-Shops und Business-Anwendungen – von der Konzeption bis zum Go-live.">${headline}</h1>
        <div class="byline rv">
            <img src="${S.photo}" alt="Avatar von Colin Deepe" width="60" height="60">
            <p><strong>${S.name}</strong><small>${S.current}</small></p>
            <a class="btn fill" href="#contact">Kontakt aufnehmen <i>→</i></a>
            <a class="btn" href="${S.github}" target="_blank" rel="noopener">GitHub <i>↗</i></a>
        </div>
        <div class="figures rv">
            <div><b><span data-count="10">10</span><sup>+</sup></b><span>Jahre E-Commerce &amp; Web</span></div>
            <div><b data-count="6">6</b><span>berufliche Stationen</span></div>
            <div><b data-count="${S.stats.repos}">${S.stats.repos}</b><span>eigene Repositories</span></div>
            <div><b data-count="${S.stats.contributions}">${S.stats.contributions}</b><span>Contributions in 12 Monaten</span></div>
        </div>
    </section>

    ${chapter('about', '01', 'Über mich', `
        <p class="lede rv">${S.about[0]}</p>
        <p class="body rv">${mark(S.about[1])}</p>`)}

    ${chapter('focus', '02', 'Fokus', `<ol class="focus">${S.focus.map((f, i) => `
        <li class="rv" style="--d:${i}"><span class="n">${'i'.repeat(i + 1)}.</span>
            <div><h3>${f.title}</h3><small>${f.count} Projekte auf GitHub</small></div><p>${f.text}</p></li>`).join('')}</ol>`)}

    <div class="band" aria-hidden="true"><div>${marquee}${marquee}</div></div>

    ${chapter('projects', '03', 'Projekte', `<div class="works">${S.projects.map((p, i) => `
        <a class="rv" style="--d:${i % 3}" href="${p.url}" target="_blank" rel="noopener">
            <div><small>${p.kind}</small><h3>${p.name}</h3></div>
            <p>${p.text}<span class="tags">${p.tags.join(' · ')}</span></p>
            <span class="go" aria-hidden="true">→</span></a>`).join('')}</div>`)}

    ${chapter('skills', '04', 'Können', `<dl class="skills">${S.skills.map((g, i) => `
        <div class="rv" style="--d:${i % 3}"><dt>${g.title}</dt><dd>${g.items.map((item) => S.highlight.includes(item) ? `<b>${item}</b>` : item).join(' · ')}</dd></div>`).join('')}</dl>`)}

    ${chapter('career', '05', 'Werdegang', `<ol class="career">${S.career.map((c) => `
        <li class="rv"><div><span class="yr">${c.year}</span><span class="span">${c.from} – ${c.to}</span></div>
            <div><h3>${c.title}${c.side ? '<span class="pill">parallel</span>' : ''}</h3><p class="org">${c.org}</p>
            ${c.points.length ? `<ul>${c.points.map((pt) => `<li>${pt}</li>`).join('')}</ul>` : ''}
            ${c.stack ? `<p class="stack">${c.stack}</p>` : ''}</div></li>`).join('')}
        <li class="rv"><div><span class="yr">2018</span><span class="span">${S.volunteer.since}</span></div>
            <div><h3>${S.volunteer.title}<span class="pill">Ehrenamt</span></h3><p class="org">${S.volunteer.org}</p>
            <ul>${S.volunteer.points.map((pt) => `<li>${pt}</li>`).join('')}</ul></div></li></ol>`)}

    ${chapter('github', '06', 'GitHub', `
        <div class="gh rv">${[[S.stats.commits, 'Commits'], [S.stats.pullRequests, 'Pull Requests'], [S.stats.activeDays, 'aktive Tage'], [S.stats.stars, 'Stars']]
            .map(([n, label]) => `<div><b data-count="${n}">${n}</b><span>${label}</span></div>`).join('')}</div>
        <div class="rv">${heatmapHTML(S.stats.heatmap)}<p class="cap">Aktivität der letzten 12 Monate · auf GitHub seit ${S.stats.since}</p></div>
        <ul class="langs rv">${S.stats.languages.map(([name, p]) => `<li><span>${name}</span><span class="track"><span class="fill" style="--p:${p}%"></span></span><span>${p} %</span></li>`).join('')}</ul>`)}

    <section class="outro wrap" id="contact">
        <p class="kicker rv"><b>●</b> Nº 07 · Kontakt</p>
        <a class="mail rv" href="mailto:${S.email}">${S.email}</a>
        <div class="byline rv"><a class="btn fill" href="mailto:${S.email}">E-Mail schreiben <i>→</i></a>
            <a class="btn" href="${S.github}" target="_blank" rel="me noopener">github.com/${S.handle} <i>↗</i></a></div>
    </section>
    <footer class="wrap"><span>© 2026 ${S.name}</span><span>Entwurf B · Editorial</span></footer>`;

onReveal('.rv', (node) => node.querySelectorAll('[data-count]').forEach(countUp));
const bar = document.getElementById('progress');
addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
}, { passive: true });
</script>
</body>
</html>
